name: Windows x64 Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package unsigned NSIS
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.88 x64 MSVC
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Audit release source tree
        run: npm run audit:release

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build Windows runtime and native helpers
        run: |
          npm run build:windows-python-runtime
          node scripts/build-windows-native.mjs
          npm run build:windows-media-helper

      - name: Run complete product verification
        run: npm run verify

      - name: Verify official Python runtime and native helpers
        run: node scripts/verify-windows-release.mjs helpers

      - name: Build unsigned Windows x64 NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --no-sign --ci

      - name: Verify installed Unicode PDF, media, speech, and prepare checksums
        run: node scripts/verify-windows-release.mjs bundle

      - name: Upload unsigned installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Yunspire-${{ github.sha }}-Windows-x64-unsigned
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 14
