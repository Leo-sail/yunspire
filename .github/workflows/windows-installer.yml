name: Windows x64 Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package unsigned NSIS
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Audit release source tree
        id: release_audit
        run: npm run audit:release

      - name: Set up Rust 1.88 x64 MSVC
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install locked JavaScript dependencies
        id: locked_dependencies
        run: npm ci

      - name: Run complete product verification
        id: product_verification
        run: npm run verify

      - name: Verify official Python runtime and native helpers
        run: node scripts/verify-windows-release.mjs helpers

      - name: Build unsigned Windows x64 NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --no-sign --ci

      - name: Verify installed Unicode PDF, media, speech, and prepare checksums
        env:
          YUNSPIRE_RELEASE_AUDIT_OUTCOME: ${{ steps.release_audit.outcome }}
          YUNSPIRE_LOCKED_DEPENDENCIES_OUTCOME: ${{ steps.locked_dependencies.outcome }}
          YUNSPIRE_PRODUCT_VERIFICATION_OUTCOME: ${{ steps.product_verification.outcome }}
        run: node scripts/verify-windows-release.mjs bundle

      - name: Upload unsigned installer and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Yunspire-${{ github.sha }}-Windows-x64-unsigned
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 14
