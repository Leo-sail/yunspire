name: Windows installer CI verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-installer:
    name: Build and smoke-test offline release NSIS (CI only)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      RUST_BACKTRACE: "1"
      YUNSPIRE_LICENSE_TARGETS: x86_64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Lock the CI source identity
        id: identity
        shell: pwsh
        run: |
          node scripts/verify-release-version.mjs source `
            --source-commit $env:GITHUB_SHA `
            --require-tag false `
            --require-clean true `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit release source tree
        id: release_audit
        run: npm run audit:release

      - name: Set up Rust 1.88 x64 MSVC
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install locked JavaScript dependencies
        id: locked_dependencies
        run: npm ci

      - name: Run complete product verification
        id: product_verification
        run: npm run verify

      - name: Verify official Python runtime and native helpers
        run: node scripts/verify-windows-release.mjs helpers

      - name: Build unsigned Windows x64 NSIS with offline WebView2
        run: >-
          npm run tauri -- build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config src-tauri/tauri.release.conf.json
          --no-sign
          --ci

      - name: Verify bundled Unicode PDF, media, speech, and CI checksums
        env:
          YUNSPIRE_RELEASE_AUDIT_OUTCOME: ${{ steps.release_audit.outcome }}
          YUNSPIRE_LOCKED_DEPENDENCIES_OUTCOME: ${{ steps.locked_dependencies.outcome }}
          YUNSPIRE_PRODUCT_VERIFICATION_OUTCOME: ${{ steps.product_verification.outcome }}
        run: node scripts/verify-windows-release.mjs bundle

      - name: Perform a CI-only silent install and startup smoke test
        shell: pwsh
        run: >-
          ./scripts/sign-windows.ps1
          -Mode VerifyUnsignedInstaller
          -ExpectedVersion "${{ steps.identity.outputs.version }}"
          -ExpectedCommit "${{ steps.identity.outputs.source_commit }}"
          -ExpectedTree "${{ steps.identity.outputs.source_tree }}"
